<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <meta name="description" content="Sign in to Cashra to track your crypto-to-cash payouts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F7A4D'/%3E%3Cpath d='M21 11.2A6.6 6.6 0 1 0 21 20.8' stroke='%23fff' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="signin">
  <header class="site-header"></header>
  <main>
    <div class="wrap">
      <div class="auth-wrap">
        <div class="auth-card">
          <h1 id="auth-title">Welcome back</h1>
          <p class="sub" id="auth-sub">Sign in to track your payouts</p>

          <div class="banner">Accounts are launching soon. You can cash out crypto right now without signing in.</div>

          <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="signin">Sign in</button>
            <button type="button" class="auth-tab" data-tab="signup">Create account</button>
          </div>

          <form class="form" style="margin-top:0;gap:14px" onsubmit="return false">
            <div class="field" id="name-field" hidden>
              <label for="au-name">Full name</label>
              <input type="text" id="au-name" autocomplete="name">
            </div>
            <div class="field">
              <label for="au-email">Email</label>
              <input type="email" id="au-email" autocomplete="email" placeholder="you@email.com">
            </div>
            <div class="field">
              <label for="au-pass">Password</label>
              <input type="password" id="au-pass" autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-brand btn-block" disabled id="au-submit">Sign in</button>
          </form>

          <p class="auth-note">Account features aren't live yet. <a href="index.html">Cash out without an account &rarr;</a></p>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script src="components.js"></script>
  <script>
    (function () {
      var tabs = document.querySelectorAll('.auth-tab');
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          tabs.forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active');
          var signup = t.dataset.tab === 'signup';
          document.getElementById('name-field').hidden = !signup;
          document.getElementById('auth-title').textContent = signup ? 'Create your account' : 'Welcome back';
          document.getElementById('auth-sub').textContent = signup ? 'Start cashing out in minutes' : 'Sign in to track your payouts';
          document.getElementById('au-submit').textContent = signup ? 'Create account' : 'Sign in';
          document.getElementById('au-pass').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
        });
      });
    })();
  </script>
</body>
</html>
