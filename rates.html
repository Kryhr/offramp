<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Rates</title>
  <meta name="description" content="Live cryptocurrency rates from Binance. Sell Bitcoin, Ethereum, Solana and stablecoins for US dollars with zero fees.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F7A4D'/%3E%3Cpath d='M8 22.5 21 9.5' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M14 9.5h7v7' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="rates">
  <header class="site-header"></header>
  <main>
    <div class="wrap">
      <div class="page-hero">
        <p class="eyebrow">Live market</p>
        <h1>Today's rates</h1>
        <p>Live prices streamed from Binance. There are no conversion fees on OffRamp, so the rate you see is the rate you get.</p>
      </div>

      <div class="rates-panel">
        <div class="rates-head">
          <span>Asset</span>
          <span class="ta-r">Price (USD)</span>
          <span class="ta-r col-change">24h change</span>
          <span class="ta-r">&nbsp;</span>
        </div>
        <div id="rates-body"></div>
      </div>

      <p class="rates-note"><span class="live-dot"></span> Prices update in real time. Rates are indicative and locked at the moment you confirm an order.</p>
    </div>
  </main>
  <footer class="site-footer"></footer>

  <script src="market.js"></script>
  <script src="components.js"></script>
  <script src="rates.js"></script>
</body>
</html>
